# Fast standard-library checks for Gyroflow+. Upstream's release.yml was
# gated to gyroflow/gyroflow and never ran here, so it was removed.
name: Fork checks

on:
  push:
    branches: [codex/lut-preview-controls]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'rsmith4321/gyrograde'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Notices tests
        run: python3 -I -m unittest discover -s _scripts/notices -p 'test_*.py'

      - name: Package tests
        run: python3 -I -m unittest discover -s tests/package-plus -p 'test_*.py'

      # The probe crate builds with --offline, so warm the Cargo registry first.
      - name: Lens input build-script test
        run: |
          cargo fetch --locked --manifest-path src/core/Cargo.toml
          python3 -I -m unittest discover -s tests/lens-input -p 'test_*.py'

      - name: Windows native notices integrity at the README pin
        run: |
          pin=$(grep -oE -- '--manifest-sha256 [0-9a-f]{64}' _scripts/notices/README.md | head -n 1 | cut -d' ' -f2)
          test -n "$pin"
          python3 -I _scripts/notices/verify_native_notices.py resources/notices/native/windows-x64 \
            --repo-root . --manifest-sha256 "$pin"
